name: unimatch_app
description: "University Social & Matching Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # Audio / Video Calling (WebRTC)
  flutter_webrtc: ^1.6.1

  # Storage & Caching
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1

  # UI, Icons, Typography & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.2.3
  video_player: ^2.14.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

dependency_overrides:
  path_provider_foundation: 2.4.0
